name: Build and publish Docker images (v2)

on:
  workflow_call:
    inputs:
      config:
        description: JSON configuration path relative to the caller repository root
        required: true
        type: string
      publish:
        description: Publish images and public tags; false validates local trial builds
        default: true
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

# Keep a complete publication serialized within each consumer. Use a different
# group from the caller's workflow-level concurrency group.
concurrency:
  group: docker-v2-${{ github.repository }}
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.plan.outputs.image }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Checkout workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow
          persist-credentials: false
      - name: Validate and expand configuration
        id: plan
        working-directory: source
        env:
          CONFIG_PATH: ${{ inputs.config }}
          PUBLISH: ${{ inputs.publish }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ "$PUBLISH" == true && ( -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ) ]]; then
            echo 'Publication requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.' >&2
            exit 1
          fi
          python ../workflow/scripts/configure.py --config "$CONFIG_PATH" --output ../plan/plan.json
      - name: Store publication plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-v2-plan
          path: plan/plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build:
    name: ${{ matrix.target }}
    needs: configuration
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.configuration.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    env:
      IMAGE: ${{ needs.configuration.outputs.image }}
      PYTHONUTF8: "1"
      RECORD_DIRECTORY: ${{ github.workspace }}/docker-v2-records/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.id }}
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Checkout workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow
          persist-credentials: false
      - name: Ensure Windows Docker is running
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service docker
          if ($service.Status -ne 'Running') { Start-Service docker }
          for ($attempt = 1; $attempt -le 24; $attempt++) {
            $os = docker --context default info --format '{{.OSType}}' 2>$null
            if ($LASTEXITCODE -eq 0 -and $os.Trim() -eq 'windows') { break }
            if ($attempt -eq 24) { throw 'Windows Docker daemon not ready after 120 seconds' }
            Start-Sleep -Seconds 5
          }
      - name: Download publication plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-v2-plan
          path: plan
      - name: Detect native platform
        id: platform
        shell: python
        run: |
          import runpy
          import sys
          sys.path.insert(0, 'workflow/scripts')
          runpy.run_path('workflow/scripts/detect_platform.py', run_name='__main__')
      - name: Set up Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Login to Docker Hub
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare shared variant builds
        if: runner.os == 'Linux'
        shell: python
        env:
          GROUP_ID: ${{ matrix.id }}
          BUILD_PLATFORM: ${{ steps.platform.outputs.platform }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          import os, subprocess
          subprocess.run(['python', 'workflow/scripts/build_group.py', 'prepare', '--plan', 'plan/plan.json', '--group', os.environ['GROUP_ID'], '--platform', os.environ['BUILD_PLATFORM'], '--publish', os.environ['PUBLISH']], check=True)
      - name: Build variants with shared BuildKit cache
        if: runner.os == 'Linux'
        id: bake
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
        with:
          files: bake/docker-bake.json
          source: .
      - name: Record variant results
        if: runner.os == 'Linux'
        shell: python
        env:
          GROUP_ID: ${{ matrix.id }}
          BUILD_PLATFORM: ${{ steps.platform.outputs.platform }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          import os, pathlib, subprocess
          # JSON string encoding safely embeds the output in the script file,
          # avoiding Linux's size limit for a single environment variable.
          pathlib.Path('bake/metadata.json').write_text(${{ toJSON(steps.bake.outputs.metadata) }}, encoding='utf-8')
          subprocess.run(['python', 'workflow/scripts/build_group.py', 'record', '--plan', 'plan/plan.json', '--group', os.environ['GROUP_ID'], '--platform', os.environ['BUILD_PLATFORM'], '--publish', os.environ['PUBLISH'], '--directory', os.environ['RECORD_DIRECTORY']], check=True)
      - name: Build Windows variants with shared local cache
        if: runner.os == 'Windows'
        working-directory: source
        shell: pwsh
        env:
          BUILD_PLATFORM: ${{ steps.platform.outputs.platform }}
          GROUP_ID: ${{ matrix.id }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python ../workflow/scripts/build_group.py classic --plan ../plan/plan.json --group $env:GROUP_ID --platform $env:BUILD_PLATFORM --publish $env:PUBLISH --directory $env:RECORD_DIRECTORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Store build result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-v2-record-${{ matrix.id }}
          path: ${{ env.RECORD_DIRECTORY }}/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publication:
    needs: [configuration, build]
    if: always() && inputs.publish && needs.configuration.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow
          persist-credentials: false
      - name: Download publication plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-v2-plan
          path: plan
      - name: Check required builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$BUILD_RESULT" != success ]]; then
            echo 'Required image builds failed or were cancelled; public tags will not be updated.' >&2
            exit 1
          fi
      - name: Download build results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-v2-record-*
          merge-multiple: true
          path: records
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish and verify public tags
        run: python workflow/scripts/publish.py --plan plan/plan.json --records records
      - name: Delete Windows staging tags
        if: always()
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python workflow/scripts/cleanup.py --plan plan/plan.json
