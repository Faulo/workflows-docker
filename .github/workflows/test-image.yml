name: Test image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - .github/workflows/test-image.yml
      - scripts/**
      - examples/test-image/**
  push:
    branches: [main]
    paths:
      - .github/workflows/docker.yml
      - .github/workflows/test-image.yml
      - scripts/**
      - examples/test-image/**

permissions:
  contents: read

jobs:
  docker:
    uses: ./.github/workflows/docker.yml
    with:
      config: examples/test-image/docker.json
      publish: false

  verify:
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-v3-plan
          path: plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-v3-record-*
          merge-multiple: true
          path: records
      - name: Verify all eight images
        run: python scripts/verify_test_image.py --plan plan/plan.json --records records
