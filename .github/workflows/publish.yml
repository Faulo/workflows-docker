name: Publish Docker image

on:
    workflow_call:
        inputs:
            image:
                description: Docker Hub repository name without the namespace
                required: true
                type: string
            tag:
                description: Tag for the merged multi-platform image
                required: false
                default: latest
                type: string
            latest:
                description: Also tag the merged multi-platform image as latest
                required: false
                default: false
                type: boolean
            build_args:
                description: JSON object containing Docker build arguments
                required: false
                default: "{}"
                type: string
            linux_platforms:
                description: JSON object mapping Linux Docker platforms to runner labels
                required: false
                default: '{"linux/amd64":"ubuntu-24.04"}'
                type: string
            windows_variants:
                description: JSON array of Windows tag suffixes and build arguments
                required: false
                default: '[{"tag":"windows","build_args":{}}]'
                type: string
            windows_platforms:
                description: JSON object mapping Windows Docker platforms to runner labels
                required: false
                default: '{"windows/amd64":"windows-2022"}'
                type: string
            linux_context:
                description: Linux Docker build context
                required: false
                default: linux
                type: string
            linux_dockerfile:
                description: Linux Dockerfile path
                required: false
                default: linux/Dockerfile
                type: string
            windows_context:
                description: Windows Docker build context
                required: false
                default: windows
                type: string
            windows_dockerfile:
                description: Windows Dockerfile path
                required: false
                default: windows/Dockerfile
                type: string
        secrets:
            DOCKERHUB_USERNAME:
                description: Docker Hub username and image namespace
                required: true
            DOCKERHUB_TOKEN:
                description: Docker Hub access token with push permission
                required: true

permissions:
    contents: read

concurrency:
    group: docker-publish-${{github.repository}}-${{inputs.tag}}
    cancel-in-progress: false

jobs:
    targets:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        env:
            LINUX_PLATFORMS: ${{inputs.linux_platforms}}
            WINDOWS_PLATFORMS: ${{inputs.windows_platforms}}
        outputs:
            linux: ${{steps.targets.outputs.linux}}
            windows: ${{steps.targets.outputs.windows}}
        steps:
            - name: Validate and prepare targets
              id: targets
              shell: bash
              run: |
                  prepare_targets() {
                    local name="$1"
                    local os="$2"
                    local architectures="$3"
                    local platforms="$4"

                    jq -ce --arg os "${os}" --arg architectures "${architectures}" '
                      type == "object" and length > 0 and
                      all(to_entries[];
                        (.key | test("^" + $os + "/(" + $architectures + ")$")) and
                        (.value | type == "string" and length > 0)
                      )
                    ' <<< "${platforms}" > /dev/null

                    jq -c --arg os "${os}" '
                      to_entries | map({
                        platform: .key,
                        runner: .value,
                        architecture: (.key | sub("^" + $os + "/"; ""))
                      })
                    ' <<< "${platforms}" |
                      sed "s/^/${name}=/" >> "${GITHUB_OUTPUT}"
                  }

                  prepare_targets linux linux 'amd64|arm64' "${LINUX_PLATFORMS}"
                  prepare_targets windows windows amd64 "${WINDOWS_PLATFORMS}"

    docker-windows:
        needs: targets
        strategy:
            fail-fast: false
            matrix:
                variant: ${{fromJSON(inputs.windows_variants)}}
                target: ${{fromJSON(needs.targets.outputs.windows)}}
        runs-on: ${{matrix.target.runner}}
        timeout-minutes: 180
        env:
            BUILD_ARGS: ${{inputs.build_args}}
            IMAGE: ${{secrets.DOCKERHUB_USERNAME}}/${{inputs.image}}
            IMAGE_TAG: ${{inputs.tag}}
            PLATFORM: ${{matrix.target.platform}}
            VARIANT_BUILD_ARGS: ${{toJSON(matrix.variant.build_args)}}
            VARIANT_TAG: ${{matrix.variant.tag}}
            WINDOWS_PLATFORMS: ${{inputs.windows_platforms}}
        steps:
            - name: Ensure Docker is running
              shell: pwsh
              run: |
                  $service = Get-Service docker -ErrorAction Stop
                  if ($service.Status -ne 'Running') {
                    Start-Service docker
                  }

                  $ready = $false
                  for ($attempt = 1; $attempt -le 24; $attempt++) {
                    docker info *> $null
                    if ($LASTEXITCODE -eq 0) {
                      $ready = $true
                      break
                    }

                    Start-Sleep -Seconds 5
                  }

                  if (-not $ready) {
                    Get-Service docker
                    throw "Docker daemon not ready after 120 seconds"
                  }

                  docker version
            - name: Prepare Windows target
              shell: pwsh
              run: |
                  if ($env:PLATFORM -ne 'windows/amd64') {
                    throw "Invalid Windows platform: $env:PLATFORM"
                  }

                  $architecture = $env:PLATFORM.Split('/')[1]
                  $platformCount = @(($env:WINDOWS_PLATFORMS | ConvertFrom-Json).PSObject.Properties).Count
                  $platformSuffix = if ($platformCount -gt 1) { "-$architecture" } else { "" }
                  "TARGET_IMAGE=$($env:IMAGE):$($env:IMAGE_TAG)-$($env:VARIANT_TAG)$platformSuffix" >> $env:GITHUB_ENV
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Login to Docker Hub
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
              with:
                  username: ${{secrets.DOCKERHUB_USERNAME}}
                  password: ${{secrets.DOCKERHUB_TOKEN}}
            - name: Restore Windows image cache
              continue-on-error: true
              shell: pwsh
              run: docker image pull $env:TARGET_IMAGE
            - name: Build Windows image
              shell: pwsh
              env:
                  BUILD_CONTEXT: ${{inputs.windows_context}}
                  DOCKERFILE: ${{inputs.windows_dockerfile}}
              run: |
                  if ($env:VARIANT_TAG -notmatch '^[A-Za-z0-9_][A-Za-z0-9_.-]*$') {
                    throw "Invalid Windows variant tag: $env:VARIANT_TAG"
                  }

                  $argumentSets = @(
                    @{ Name = 'build_args'; Value = $env:BUILD_ARGS },
                    @{ Name = 'windows variant build_args'; Value = $env:VARIANT_BUILD_ARGS }
                  )
                  $arguments = [ordered]@{}
                  foreach ($argumentSet in $argumentSets) {
                    $values = $argumentSet.Value | ConvertFrom-Json
                    if ($values -isnot [PSCustomObject]) {
                      throw "$($argumentSet.Name) must be a JSON object"
                    }

                    foreach ($argument in $values.PSObject.Properties) {
                      $arguments[$argument.Name] = $argument.Value
                    }
                  }

                  $dockerBuildArgs = @()
                  foreach ($argument in $arguments.GetEnumerator()) {
                    if ($argument.Key -notmatch '^[A-Za-z_][A-Za-z0-9_]*$') {
                      throw "Invalid build argument name: $($argument.Key)"
                    }

                    $value = if ($argument.Value -is [string]) {
                      $argument.Value
                    } else {
                      $argument.Value | ConvertTo-Json -Compress
                    }

                    $dockerBuildArgs += "--build-arg"
                    $dockerBuildArgs += "$($argument.Key)=$value"
                  }

                  docker build --isolation=hyperv `
                    --platform $env:PLATFORM `
                    --pull `
                    --cache-from $env:TARGET_IMAGE `
                    --file $env:DOCKERFILE `
                    --tag $env:TARGET_IMAGE `
                    @dockerBuildArgs `
                    $env:BUILD_CONTEXT

                  if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                  }
            - name: Push Windows image
              shell: pwsh
              run: docker image push $env:TARGET_IMAGE

    docker-linux:
        needs: targets
        strategy:
            fail-fast: false
            matrix:
                target: ${{fromJSON(needs.targets.outputs.linux)}}
        runs-on: ${{matrix.target.runner}}
        timeout-minutes: 90
        env:
            BUILD_ARGS: ${{inputs.build_args}}
            IMAGE: ${{secrets.DOCKERHUB_USERNAME}}/${{inputs.image}}
            IMAGE_TAG: ${{inputs.tag}}
            LINUX_PLATFORMS: ${{inputs.linux_platforms}}
            PLATFORM: ${{matrix.target.platform}}
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
            - name: Login to Docker Hub
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
              with:
                  username: ${{secrets.DOCKERHUB_USERNAME}}
                  password: ${{secrets.DOCKERHUB_TOKEN}}
            - name: Prepare build arguments
              id: build-args
              shell: bash
              run: |
                  jq -e '
                    type == "object" and
                    all(keys[]; test("^[A-Za-z_][A-Za-z0-9_]*$"))
                  ' <<< "${BUILD_ARGS}" > /dev/null

                  delimiter="docker_build_args_${RANDOM}_${RANDOM}"
                  {
                    echo "value<<${delimiter}"
                    jq -r 'to_entries[] | "\(.key)=\(.value | tostring)"' <<< "${BUILD_ARGS}"
                    echo "${delimiter}"
                  } >> "${GITHUB_OUTPUT}"
            - name: Prepare Linux target
              id: target
              shell: bash
              run: |
                  architecture="${PLATFORM#linux/}"
                  platform_suffix=""
                  if (( $(jq 'length' <<< "${LINUX_PLATFORMS}") > 1 )); then
                    platform_suffix="-${architecture}"
                  fi

                  echo "image=${IMAGE}:${IMAGE_TAG}-linux${platform_suffix}" >> "${GITHUB_OUTPUT}"
            - name: Build and push Linux image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: ${{inputs.linux_context}}
                  file: ${{inputs.linux_dockerfile}}
                  push: true
                  pull: true
                  tags: ${{steps.target.outputs.image}}
                  platforms: ${{matrix.target.platform}}
                  build-args: ${{steps.build-args.outputs.value}}
                  cache-from: type=gha,scope=${{inputs.image}}-${{inputs.tag}}-linux-${{matrix.target.architecture}}
                  cache-to: type=gha,mode=max,scope=${{inputs.image}}-${{inputs.tag}}-linux-${{matrix.target.architecture}}
                  provenance: mode=max
                  sbom: true

    merge:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs:
            - targets
            - docker-windows
            - docker-linux
        env:
            IMAGE: ${{secrets.DOCKERHUB_USERNAME}}/${{inputs.image}}
            IMAGE_TAG: ${{inputs.tag}}
            LINUX_PLATFORMS: ${{inputs.linux_platforms}}
            PUBLISH_LATEST: ${{inputs.latest}}
            WINDOWS_PLATFORMS: ${{inputs.windows_platforms}}
            WINDOWS_VARIANTS: ${{inputs.windows_variants}}
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
            - name: Login to Docker Hub
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
              with:
                  username: ${{secrets.DOCKERHUB_USERNAME}}
                  password: ${{secrets.DOCKERHUB_TOKEN}}
            - name: Merge manifests
              shell: bash
              run: |
                  jq -e '
                    type == "array" and length > 0 and
                    all(.[].tag; type == "string" and test("^[A-Za-z0-9_][A-Za-z0-9_.-]*$")) and
                    all(.[].build_args; type == "object") and
                    ([.[].tag] | length == (unique | length))
                  ' <<< "${WINDOWS_VARIANTS}" > /dev/null

                  sources=()
                  linux_sources=()
                  linux_platform_count="$(jq 'length' <<< "${LINUX_PLATFORMS}")"
                  while IFS= read -r platform; do
                    architecture="${platform#linux/}"
                    platform_suffix=""
                    if (( linux_platform_count > 1 )); then
                      platform_suffix="-${architecture}"
                    fi

                    linux_source="${IMAGE}:${IMAGE_TAG}-linux${platform_suffix}"
                    linux_sources+=("${linux_source}")
                    sources+=("${linux_source}")
                  done < <(jq -r 'keys[]' <<< "${LINUX_PLATFORMS}")

                  windows_sources=()
                  platform_count="$(jq 'length' <<< "${WINDOWS_PLATFORMS}")"
                  while IFS=$'\t' read -r variant_tag platform; do
                    architecture="${platform#windows/}"
                    platform_suffix=""
                    if (( platform_count > 1 )); then
                      platform_suffix="-${architecture}"
                    fi

                    variant_image="${IMAGE}:${IMAGE_TAG}-${variant_tag}${platform_suffix}"
                    variant_manifest="${variant_image}-manifest"
                    inspection="$(docker buildx imagetools inspect "${variant_image}" --format '{{json .}}')"
                    os_version="$(jq -er --arg architecture "${architecture}" '
                      select(.image.os == "windows" and .image.architecture == $architecture) |
                      .image["os.version"] |
                      select(type == "string" and length > 0)
                    ' <<< "${inspection}")"

                    docker manifest create "${variant_manifest}" "${variant_image}"
                    docker manifest annotate \
                      "${variant_manifest}" \
                      "${variant_image}" \
                      --os windows \
                      --arch "${architecture}" \
                      --os-version "${os_version}"
                    docker manifest push "${variant_manifest}"
                    windows_sources+=("${variant_manifest}")
                    sources+=("${variant_manifest}")
                  done < <(
                    jq -r \
                      --argjson platforms "${WINDOWS_PLATFORMS}" \
                      '.[] as $variant | $platforms | keys[] | [$variant.tag, .] | @tsv' \
                      <<< "${WINDOWS_VARIANTS}"
                  )

                  tags=(--tag "${IMAGE}:${IMAGE_TAG}")
                  if [[ "${PUBLISH_LATEST}" == true && "${IMAGE_TAG}" != latest ]]; then
                    tags+=(--tag "${IMAGE}:latest")
                  fi

                  docker buildx imagetools create "${tags[@]}" "${sources[@]}"

                  linux_tags=()
                  linux_image="${IMAGE}:${IMAGE_TAG}-linux"
                  if (( ${#linux_sources[@]} != 1 )) || [[ "${linux_sources[0]}" != "${linux_image}" ]]; then
                    linux_tags+=(--tag "${linux_image}")
                  fi
                  if [[ "${PUBLISH_LATEST}" == true && "${IMAGE_TAG}" != latest ]]; then
                    linux_tags+=(--tag "${IMAGE}:latest-linux")
                  fi
                  if (( ${#linux_tags[@]} > 0 )); then
                    docker buildx imagetools create "${linux_tags[@]}" "${linux_sources[@]}"
                  fi

                  windows_tags=(--tag "${IMAGE}:${IMAGE_TAG}-windows")
                  if [[ "${PUBLISH_LATEST}" == true && "${IMAGE_TAG}" != latest ]]; then
                    windows_tags+=(--tag "${IMAGE}:latest-windows")
                  fi
                  docker buildx imagetools create "${windows_tags[@]}" "${windows_sources[@]}"

                  if [[ "${PUBLISH_LATEST}" == true && "${IMAGE_TAG}" != latest ]]; then
                    while IFS= read -r variant_tag; do
                      if [[ "${variant_tag}" != windows ]]; then
                        docker buildx imagetools create \
                          --tag "${IMAGE}:latest-${variant_tag}" \
                          "${IMAGE}:${IMAGE_TAG}-${variant_tag}"
                      fi
                    done < <(jq -r '.[].tag' <<< "${WINDOWS_VARIANTS}")
                  fi
            - name: Verify merged manifest
              shell: bash
              run: |
                  manifest="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --raw)"
                  jq -e \
                    --argjson linux "${LINUX_PLATFORMS}" \
                    --argjson windows "${WINDOWS_PLATFORMS}" \
                    --argjson variants "${WINDOWS_VARIANTS}" '
                    . as $manifest |
                    all($linux | keys[];
                      split("/") as $expected |
                      any($manifest.manifests[];
                        .platform.os == $expected[0] and
                        .platform.architecture == $expected[1]
                      )
                    ) and
                    all($windows | keys[];
                      split("/") as $expected |
                      [
                        $manifest.manifests[].platform |
                        select(
                          .os == $expected[0] and
                          .architecture == $expected[1]
                        ) |
                        .["os.version"]
                      ] as $versions |
                      ($versions | length) == ($variants | length) and
                      all($versions[]; type == "string" and length > 0) and
                      ($versions | unique | length) == ($variants | length)
                    )
                  ' <<< "${manifest}"

                  if [[ "${PUBLISH_LATEST}" == true ]]; then
                    latest_manifest="$(docker buildx imagetools inspect "${IMAGE}:latest" --raw)"
                    if [[ "${latest_manifest}" != "${manifest}" ]]; then
                      echo "${IMAGE}:${IMAGE_TAG} and ${IMAGE}:latest do not reference the same manifest" >&2
                      exit 1
                    fi
                  fi

                  docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}"
                  docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}-linux"
                  docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}-windows"
                  while IFS= read -r variant_tag; do
                    docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}-${variant_tag}"
                  done < <(jq -r '.[].tag' <<< "${WINDOWS_VARIANTS}")

                  if [[ "${PUBLISH_LATEST}" == true && "${IMAGE_TAG}" != latest ]]; then
                    docker buildx imagetools inspect "${IMAGE}:latest-linux"
                    docker buildx imagetools inspect "${IMAGE}:latest-windows"
                    while IFS= read -r variant_tag; do
                      docker buildx imagetools inspect "${IMAGE}:latest-${variant_tag}"
                    done < <(jq -r '.[].tag' <<< "${WINDOWS_VARIANTS}")
                  fi
            - name: Delete temporary Windows manifest tags
              if: ${{always()}}
              shell: bash
              env:
                  DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
                  DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
                  DOCKERHUB_REPOSITORY: ${{inputs.image}}
              run: |
                  access_token="$(
                    jq -n \
                      --arg identifier "${DOCKERHUB_USERNAME}" \
                      --arg secret "${DOCKERHUB_TOKEN}" \
                      '{identifier: $identifier, secret: $secret}' |
                      curl --fail-with-body --silent --show-error \
                        --request POST \
                        --header 'Content-Type: application/json' \
                        --data-binary @- \
                        https://hub.docker.com/v2/auth/token |
                      jq -er '.access_token | select(type == "string" and length > 0)'
                  )"

                  namespace="$(jq -rn --arg value "${DOCKERHUB_USERNAME}" '$value | @uri')"
                  encoded_repository="$(jq -rn --arg value "${DOCKERHUB_REPOSITORY}" '$value | @uri')"
                  platform_count="$(jq 'length' <<< "${WINDOWS_PLATFORMS}")"
                  while IFS=$'\t' read -r variant_tag platform; do
                    architecture="${platform#windows/}"
                    platform_suffix=""
                    if (( platform_count > 1 )); then
                      platform_suffix="-${architecture}"
                    fi

                    helper_tag="${IMAGE_TAG}-${variant_tag}${platform_suffix}-manifest"
                    encoded_tag="$(jq -rn --arg value "${helper_tag}" '$value | @uri')"
                    status="$(
                      curl --silent --show-error \
                        --output /dev/null \
                        --write-out '%{http_code}' \
                        --request DELETE \
                        --header "Authorization: Bearer ${access_token}" \
                        "https://hub.docker.com/v2/namespaces/${namespace}/repositories/${encoded_repository}/tags/${encoded_tag}"
                    )"
                    if [[ "${status}" != 204 && "${status}" != 404 ]]; then
                      echo "Failed to delete temporary tag ${helper_tag}: HTTP ${status}" >&2
                      exit 1
                    fi
                  done < <(
                    jq -r \
                      --argjson platforms "${WINDOWS_PLATFORMS}" \
                      '.[] as $variant | $platforms | keys[] | [$variant.tag, .] | @tsv' \
                      <<< "${WINDOWS_VARIANTS}"
                  )
