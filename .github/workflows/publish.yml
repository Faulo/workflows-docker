name: Publish Docker image

on:
    workflow_call:
        inputs:
            image:
                description: Docker Hub repository name without the namespace
                required: true
                type: string
            tag:
                description: Tag for the merged multi-platform image
                required: false
                default: latest
                type: string
            build_args:
                description: JSON object containing Docker build arguments
                required: false
                default: "{}"
                type: string
            windows_variants:
                description: JSON array of Windows tag suffixes and build arguments
                required: false
                default: '[{"tag":"windows","build_args":{}}]'
                type: string
            linux_context:
                description: Linux Docker build context
                required: false
                default: linux
                type: string
            linux_dockerfile:
                description: Linux Dockerfile path
                required: false
                default: linux/Dockerfile
                type: string
            windows_context:
                description: Windows Docker build context
                required: false
                default: windows
                type: string
            windows_dockerfile:
                description: Windows Dockerfile path
                required: false
                default: windows/Dockerfile
                type: string
        secrets:
            DOCKERHUB_USERNAME:
                description: Docker Hub username and image namespace
                required: true
            DOCKERHUB_TOKEN:
                description: Docker Hub access token with push permission
                required: true

permissions:
    contents: read

concurrency:
    group: docker-publish-${{github.repository}}-${{inputs.tag}}
    cancel-in-progress: false

jobs:
    docker-windows:
        strategy:
            fail-fast: false
            matrix:
                variant: ${{fromJSON(inputs.windows_variants)}}
        runs-on: windows-2022
        timeout-minutes: 180
        env:
            BUILD_ARGS: ${{inputs.build_args}}
            IMAGE: ${{secrets.DOCKERHUB_USERNAME}}/${{inputs.image}}
            IMAGE_TAG: ${{inputs.tag}}
            VARIANT_BUILD_ARGS: ${{toJSON(matrix.variant.build_args)}}
            VARIANT_TAG: ${{matrix.variant.tag}}
        steps:
            - name: Ensure Docker is running
              shell: pwsh
              run: |
                  $service = Get-Service docker -ErrorAction Stop
                  if ($service.Status -ne 'Running') {
                    Start-Service docker
                  }

                  $ready = $false
                  for ($attempt = 1; $attempt -le 24; $attempt++) {
                    docker info *> $null
                    if ($LASTEXITCODE -eq 0) {
                      $ready = $true
                      break
                    }

                    Start-Sleep -Seconds 5
                  }

                  if (-not $ready) {
                    Get-Service docker
                    throw "Docker daemon not ready after 120 seconds"
                  }

                  docker version
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Login to Docker Hub
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
              with:
                  username: ${{secrets.DOCKERHUB_USERNAME}}
                  password: ${{secrets.DOCKERHUB_TOKEN}}
            - name: Restore Windows image cache
              continue-on-error: true
              shell: pwsh
              run: docker image pull "${env:IMAGE}:${env:IMAGE_TAG}-${env:VARIANT_TAG}"
            - name: Build Windows image
              shell: pwsh
              env:
                  BUILD_CONTEXT: ${{inputs.windows_context}}
                  DOCKERFILE: ${{inputs.windows_dockerfile}}
              run: |
                  if ($env:VARIANT_TAG -notmatch '^[A-Za-z0-9_][A-Za-z0-9_.-]*$') {
                    throw "Invalid Windows variant tag: $env:VARIANT_TAG"
                  }

                  $argumentSets = @(
                    @{ Name = 'build_args'; Value = $env:BUILD_ARGS },
                    @{ Name = 'windows variant build_args'; Value = $env:VARIANT_BUILD_ARGS }
                  )
                  $arguments = [ordered]@{}
                  foreach ($argumentSet in $argumentSets) {
                    $values = $argumentSet.Value | ConvertFrom-Json
                    if ($values -isnot [PSCustomObject]) {
                      throw "$($argumentSet.Name) must be a JSON object"
                    }

                    foreach ($argument in $values.PSObject.Properties) {
                      $arguments[$argument.Name] = $argument.Value
                    }
                  }

                  $dockerBuildArgs = @()
                  foreach ($argument in $arguments.GetEnumerator()) {
                    if ($argument.Key -notmatch '^[A-Za-z_][A-Za-z0-9_]*$') {
                      throw "Invalid build argument name: $($argument.Key)"
                    }

                    $value = if ($argument.Value -is [string]) {
                      $argument.Value
                    } else {
                      $argument.Value | ConvertTo-Json -Compress
                    }

                    $dockerBuildArgs += "--build-arg"
                    $dockerBuildArgs += "$($argument.Key)=$value"
                  }

                  docker build --isolation=hyperv `
                    --pull `
                    --cache-from "${env:IMAGE}:${env:IMAGE_TAG}-${env:VARIANT_TAG}" `
                    --file $env:DOCKERFILE `
                    --tag "${env:IMAGE}:${env:IMAGE_TAG}-${env:VARIANT_TAG}" `
                    @dockerBuildArgs `
                    $env:BUILD_CONTEXT

                  if ($LASTEXITCODE -ne 0) {
                    exit $LASTEXITCODE
                  }
            - name: Push Windows image
              shell: pwsh
              run: docker image push "${env:IMAGE}:${env:IMAGE_TAG}-${env:VARIANT_TAG}"

    docker-linux:
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        env:
            BUILD_ARGS: ${{inputs.build_args}}
            IMAGE: ${{secrets.DOCKERHUB_USERNAME}}/${{inputs.image}}
            IMAGE_TAG: ${{inputs.tag}}
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
            - name: Login to Docker Hub
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
              with:
                  username: ${{secrets.DOCKERHUB_USERNAME}}
                  password: ${{secrets.DOCKERHUB_TOKEN}}
            - name: Prepare build arguments
              id: build-args
              shell: bash
              run: |
                  jq -e '
                    type == "object" and
                    all(keys[]; test("^[A-Za-z_][A-Za-z0-9_]*$"))
                  ' <<< "${BUILD_ARGS}" > /dev/null

                  delimiter="docker_build_args_${RANDOM}_${RANDOM}"
                  {
                    echo "value<<${delimiter}"
                    jq -r 'to_entries[] | "\(.key)=\(.value | tostring)"' <<< "${BUILD_ARGS}"
                    echo "${delimiter}"
                  } >> "${GITHUB_OUTPUT}"
            - name: Build and push Linux image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: ${{inputs.linux_context}}
                  file: ${{inputs.linux_dockerfile}}
                  push: true
                  pull: true
                  tags: ${{env.IMAGE}}:${{env.IMAGE_TAG}}-linux
                  platforms: linux/amd64
                  build-args: ${{steps.build-args.outputs.value}}
                  cache-from: type=gha,scope=${{inputs.image}}-${{inputs.tag}}-linux
                  cache-to: type=gha,mode=max,scope=${{inputs.image}}-${{inputs.tag}}-linux
                  provenance: mode=max
                  sbom: true

    merge:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs:
            - docker-windows
            - docker-linux
        env:
            IMAGE: ${{secrets.DOCKERHUB_USERNAME}}/${{inputs.image}}
            IMAGE_TAG: ${{inputs.tag}}
            WINDOWS_VARIANTS: ${{inputs.windows_variants}}
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
            - name: Login to Docker Hub
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
              with:
                  username: ${{secrets.DOCKERHUB_USERNAME}}
                  password: ${{secrets.DOCKERHUB_TOKEN}}
            - name: Merge manifests
              shell: bash
              run: |
                  jq -e '
                    type == "array" and length > 0 and
                    all(.[].tag; type == "string" and test("^[A-Za-z0-9_][A-Za-z0-9_.-]*$")) and
                    all(.[].build_args; type == "object") and
                    ([.[].tag] | length == (unique | length))
                  ' <<< "${WINDOWS_VARIANTS}" > /dev/null

                  sources=("${IMAGE}:${IMAGE_TAG}-linux")
                  while IFS= read -r variant_tag; do
                    variant_image="${IMAGE}:${IMAGE_TAG}-${variant_tag}"
                    variant_manifest="${variant_image}-manifest"
                    inspection="$(docker buildx imagetools inspect "${variant_image}" --format '{{json .}}')"
                    os_version="$(jq -er '
                      select(.image.os == "windows" and .image.architecture == "amd64") |
                      .image["os.version"] |
                      select(type == "string" and length > 0)
                    ' <<< "${inspection}")"

                    docker manifest create "${variant_manifest}" "${variant_image}"
                    docker manifest annotate \
                      "${variant_manifest}" \
                      "${variant_image}" \
                      --os windows \
                      --arch amd64 \
                      --os-version "${os_version}"
                    docker manifest push "${variant_manifest}"
                    sources+=("${variant_manifest}")
                  done < <(jq -r '.[].tag' <<< "${WINDOWS_VARIANTS}")

                  docker buildx imagetools create \
                    --tag "${IMAGE}:${IMAGE_TAG}" \
                    "${sources[@]}"
            - name: Verify merged manifest
              shell: bash
              run: |
                  manifest="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --raw)"
                  expected_windows="$(jq 'length' <<< "${WINDOWS_VARIANTS}")"
                  jq -e --argjson expected_windows "${expected_windows}" '
                    any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
                    ([.manifests[] |
                      select(.platform.os == "windows" and .platform.architecture == "amd64") |
                      .platform["os.version"]] as $windows_versions |
                      ($windows_versions | length) == $expected_windows and
                      all($windows_versions[]; type == "string" and length > 0) and
                      ($windows_versions | unique | length) == $expected_windows)
                  ' <<< "${manifest}"
                  docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}"
            - name: Delete temporary Windows manifest tags
              if: ${{always()}}
              shell: bash
              env:
                  DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
                  DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
                  DOCKERHUB_REPOSITORY: ${{inputs.image}}
              run: |
                  access_token="$(
                    jq -n \
                      --arg identifier "${DOCKERHUB_USERNAME}" \
                      --arg secret "${DOCKERHUB_TOKEN}" \
                      '{identifier: $identifier, secret: $secret}' |
                      curl --fail-with-body --silent --show-error \
                        --request POST \
                        --header 'Content-Type: application/json' \
                        --data-binary @- \
                        https://hub.docker.com/v2/auth/token |
                      jq -er '.access_token | select(type == "string" and length > 0)'
                  )"

                  namespace="$(jq -rn --arg value "${DOCKERHUB_USERNAME}" '$value | @uri')"
                  encoded_repository="$(jq -rn --arg value "${DOCKERHUB_REPOSITORY}" '$value | @uri')"
                  while IFS= read -r variant_tag; do
                    helper_tag="${IMAGE_TAG}-${variant_tag}-manifest"
                    encoded_tag="$(jq -rn --arg value "${helper_tag}" '$value | @uri')"
                    status="$(
                      curl --silent --show-error \
                        --output /dev/null \
                        --write-out '%{http_code}' \
                        --request DELETE \
                        --header "Authorization: Bearer ${access_token}" \
                        "https://hub.docker.com/v2/namespaces/${namespace}/repositories/${encoded_repository}/tags/${encoded_tag}"
                    )"
                    if [[ "${status}" != 204 && "${status}" != 404 ]]; then
                      echo "Failed to delete temporary tag ${helper_tag}: HTTP ${status}" >&2
                      exit 1
                    fi
                  done < <(jq -r '.[].tag' <<< "${WINDOWS_VARIANTS}")
